opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - first_where
  - sorted_imports
  - explicit_init
  - redundant_nil_coalescing

disabled_rules:
  - todo

excluded:
  - .build
  - DerivedData
  - gh-notch.xcodeproj
  - tools # build tooling (e.g. the AppIcon generator), not shipped app code

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

# Opt-in rules default to warning, so force_unwrapping is pinned to error here
# (alongside force_cast/force_try): no force-unwraps anywhere (see DEVELOPMENT.md).
force_unwrapping: error
force_cast: error
force_try: error
