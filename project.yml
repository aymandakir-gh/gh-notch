name: gh-notch

options:
  bundleIdPrefix: company.gh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # set your Apple Developer Team ID in Xcode → Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  gh-notch:
    type: application
    platform: macOS
    sources:
      - path: gh-notch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: company.gh.notch
        INFOPLIST_FILE: gh-notch/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: gh-notch/Resources/gh-notch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    info:
      path: gh-notch/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: gh-notch
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT License. Copyright (c) 2026 GrowthHackers."
        # Track the build-setting version so xcodegen regenerates the same plist
        # every run (idempotent) and release DMGs report the real tag version
        # instead of xcodegen's literal 1.0 default.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSPrincipalClass: NSApplication
        # Calendar (EventKit). Full-access key is required by macOS 14
        # requestFullAccessToEvents; the legacy key is kept for older systems.
        NSCalendarsUsageDescription: "gh-notch shows your upcoming events in the notch. Your calendar data stays on your Mac."
        NSCalendarsFullAccessUsageDescription: "gh-notch shows your upcoming events in the notch. Your calendar data stays on your Mac."

  gh-notchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: gh-notchTests
    dependencies:
      - target: gh-notch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: company.gh.notchTests

schemes:
  gh-notch:
    build:
      targets:
        gh-notch: all
        gh-notchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - gh-notchTests
